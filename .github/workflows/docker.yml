name: docker

# Build the shipping Dockerfile end-to-end. This is the final smoke test:
# colcon-build CI proves the package compiles given a clean ROS env, this
# proves the actual deployment container builds from scratch. Slow (full apt
# + PCL + Eigen install) so it's gated behind concurrency and run only on
# PRs and pushes to develop.

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker build (Dockerfile, Jazzy)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        # buildx required for the `--mount=type=bind` syntax used inside the
        # Dockerfile's `RUN --mount=...` for the colcon build step.
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          # GitHub Actions cache: speeds up incremental Dockerfile changes
          # (PCL / Eigen / ros-jazzy-pcl* apt steps cache well; the colcon
          # build step does not, since it bind-mounts the source).
          cache-from: type=gha
          cache-to: type=gha,mode=max
