name: unit-tests

# Fast, ROS-free gates (HARDENING Phase 5):
#  - estimator-core: the math / parsing / spline cores with Eigen + GoogleTest,
#    runs in seconds on every push/PR.
#  - estimator-core-asan: the same suite under AddressSanitizer + UBSan.
#  - ikdtree-tsan: the ikd-Tree concurrency regressions (Phase 2.4 Push_Down,
#    Phase 2.5 rebuild-vs-mutator + lock-order gates) under ThreadSanitizer.
#    Needs PCL point types (plain libpcl-dev, still no ROS). TSan slows the
#    stress ~30x, so this is a separate job with its own generous timeout.
#
#  - e2e-smoke: bag-FREE end-to-end gate (2026-07-11) — installs ROS 2 Jazzy,
#    builds the real node, drives it with data_injector's deterministic
#    stationary scene, and asserts the pose holds the origin, /odom flows,
#    NIS never DIVERGES and the TF guard stays quiet (scripts/e2e_smoke.sh).
#    Catches gross pipeline regressions in ~10 min without a bag.
#
# Still pending from the Phase 5 table: a bag-replay ACCURACY test (APE/RPE on
# a real dataset) — blocked on a representative bag being available to CI;
# scripts/overload_rehearsal.sh covers it manually on developer machines.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs: these jobs are pure gates on a snapshot of the tree,
# so a second push to the same branch/PR makes the first run's verdict
# irrelevant — and the e2e-smoke job holds a runner for up to 40 min.
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estimator-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # libpcl-dev is REQUIRED, not optional: resple/test/CMakeLists.txt gates
        # test_ikdtree_concurrency on find_package(PCL), so without it this job
        # silently dropped the ikd-Tree concurrency regression (Phase 2.4/2.5)
        # and reported a smaller suite as green. Verified locally: the PCL-gated
        # target contributes 2 ctest cases that are otherwise absent.
        #
        # Runtime note: IkdTreeConcurrency.RebuildVsMutatorRace is the dominant
        # cost of this job, and its cost is set by the SCHEDULER, not by the
        # work — the mutator needs a unique lock while four readers spin on the
        # shared one. Measured: ~9 s on a wide host, ~135 s on a 4-CPU box,
        # >300 s on a loaded runner. The advice that used to live here ("raise
        # the TIMEOUT if it flakes") lost that race three times; the case now
        # bounds ITSELF by wall time (RESPLE_IKD_STRESS_SECONDS, default 90 s,
        # +1 in-flight burst) and the ctest TIMEOUT is only a hang backstop. Set
        # the env var here if this job's budget ever needs the stress shortened.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libeigen3-dev libgtest-dev libboost-math-dev libpcl-dev
      - name: Build and run unit tests
        run: ./scripts/run_unit_tests.sh

  estimator-core-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # libpcl-dev: same silent-drop as estimator-core above, and it matters
        # MOST here — resple/test/CMakeLists.txt documents this very job
        # ("Surfaced here by the Phase 5 ASan CI job on test_ikdtree_concurrency")
        # as the guard for the Eigen aligned-allocator ABI regression, which is
        # exactly a PCL-headers-vs-plain-Eigen mismatch. Without PCL the target
        # never built, so the guard was watching nothing.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libeigen3-dev libgtest-dev libboost-math-dev libpcl-dev
      - name: Build (ASan + UBSan)
        run: |
          cmake -S resple/test -B build/asan \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1 -fno-omit-frame-pointer"
          cmake --build build/asan -j"$(nproc)"
      - name: Run under ASan + UBSan
        # -E RebuildVsMutatorRace: that one case is a deliberately unthrottled
        # 4-reader spin stress. It used to be excluded because it blew the ctest
        # timeout under ASan; it now self-bounds by wall time, so that reason is
        # gone and the honest one is COST. Measured under ASan+UBSan with the
        # stress budget cut to 60 s: 338 s total, because ~280 s of it is the
        # fixed 40k-point Build plus tree teardown, which no budget shortens.
        # That is 5-10 minutes of a 30-minute job for UAF coverage of the
        # rebuild path — affordable, but it would be the job's dominant cost, so
        # it stays out by choice. Re-enabling is a one-line change (drop -E, add
        # RESPLE_IKD_STRESS_SECONDS=20 and raise timeout-minutes).
        #
        # Its sibling ParallelSearchPushDownRace still runs, which is what
        # exercises the PCL point types through Eigen's aligned allocator (the
        # ABI guard above). The excluded case is covered by the ikdtree-tsan
        # job, whose 45-minute budget is sized for it.
        run: |
          ASAN_OPTIONS="detect_leaks=1" UBSAN_OPTIONS="print_stacktrace=1" \
            ctest --test-dir build/asan --output-on-failure --no-tests=error \
              -E "RebuildVsMutatorRace"

  ikdtree-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (incl. PCL, no ROS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libeigen3-dev libgtest-dev libboost-math-dev libpcl-dev
      - name: Build concurrency tests (TSan)
        run: |
          cmake -S resple/test -B build/tsan \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -fno-omit-frame-pointer"
          cmake --build build/tsan -j"$(nproc)" --target test_ikdtree_concurrency
      - name: Run under ThreadSanitizer
        # The suppressions file is intentionally empty of active entries
        # (Phase 2.5 #1 fixed); passing it keeps the invocation canonical and
        # makes any future (justified) suppression take effect here too.
        # halt_on_error=1: any data race / lock-order report fails the job.
        #
        # RESPLE_IKD_STRESS_SECONDS: the stress case self-bounds at 90 s by
        # default, which under TSan's ~30x slowdown would buy almost no mutator
        # bursts — and THIS is the job where the rebuild-vs-mutator hunt
        # actually happens. Give it 20 minutes of the 45-minute budget (the
        # deadline is checked between bursts, so allow for one more in flight
        # plus the TSan build above).
        run: |
          RESPLE_IKD_STRESS_SECONDS=1200 \
          TSAN_OPTIONS="halt_on_error=1:suppressions=$PWD/resple/test/tsan_suppressions.txt" \
            ./build/tsan/test_ikdtree_concurrency

  e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 Jazzy + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg lsb-release ca-certificates
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git python3-numpy python3-dev python3-yaml \
            libeigen3-dev libyaml-cpp-dev libblas-dev liblapack-dev libomp-dev \
            ros-jazzy-ros-base ros-dev-tools python3-colcon-common-extensions \
            libpcl-dev ros-jazzy-pcl-conversions \
            ros-jazzy-visualization-msgs ros-jazzy-nav-msgs ros-jazzy-std-srvs \
            ros-jazzy-tf2-ros ros-jazzy-tf2-eigen \
            ros-jazzy-tf2-geometry-msgs ros-jazzy-tf2-sensor-msgs \
            ros-jazzy-rclcpp-lifecycle ros-jazzy-rclcpp-action ros-jazzy-rclcpp-components \
            ros-jazzy-diagnostic-updater ros-jazzy-ament-cmake-gtest
      - name: Build + run smoke
        run: SECONDS_RUN=45 ./scripts/e2e_smoke.sh
      - name: Integration tests (ROS + PCL)
        # These were gated behind -DRESPLE_BUILD_INTEGRATION_TESTS=OFF and run
        # by NOTHING, so the coverage they claim (real sensor_msgs/PointCloud2
        # through ingestPointCloud2; the esti_plane PCL path; the full lifecycle
        # re-cycle) did not actually exist — and the lifecycle test was in fact
        # broken in a way that could never pass, which is what happens to a test
        # nobody runs. This job already has ROS 2 Jazzy + PCL installed, so
        # running them here costs only the build.
        #
        # Not folded into the other jobs: they are deliberately ROS-free and
        # fast. This is the one job that already pays for a ROS install.
        # Reuses the workspace e2e_smoke.sh already assembled at ~/ros2_ws
        # (symlinked packages + the data_injector), so this is a re-configure of
        # an existing build tree, not a second checkout.
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          cd "${HOME}/ros2_ws"
          PYEXE=/usr/bin/python3.12
          colcon build --packages-up-to resple \
            --cmake-args -DRESPLE_BUILD_INTEGRATION_TESTS=ON \
                         -DENABLE_NATIVE_ARCH=OFF \
                         "-DPython3_EXECUTABLE=${PYEXE}"
          # --return-code-on-test-failure: without it colcon test exits 0 even
          # when cases fail, which is how this repo has shipped green-but-empty
          # gates before.
          colcon test --packages-select resple --return-code-on-test-failure \
            --event-handlers console_direct+
