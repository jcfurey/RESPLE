name: lint

# Runs the ament_lint_auto suite (cppcheck, cpplint, lint_cmake, xmllint,
# flake8, pep257) as colcon tests. The CMakeLists.txt BUILD_TESTING block
# decides which checks are active — `copyright` and `uncrustify` are
# skipped there because the legacy codebase doesn't conform to either
# yet. Everything else runs.
#
# Advisory only at first (`continue-on-error: true`). Once the initial
# backlog is cleared, flip continue-on-error to false to make these
# required.

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ament-lint:
    name: ament_lint_auto (advisory)
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      - name: Checkout (into colcon src layout)
        uses: actions/checkout@v4
        with:
          path: src/RESPLE
      - name: Install build + lint dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            libeigen3-dev \
            libomp-dev \
            libpcl-dev \
            libyaml-cpp-dev \
            ros-jazzy-pcl-conversions \
            ros-jazzy-pcl-msgs \
            ros-jazzy-pcl-ros \
            ros-jazzy-diagnostic-updater \
            ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-ament-lint-auto \
            ros-jazzy-ament-lint-common
      - name: colcon build (configure stage required for colcon test)
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build \
            --packages-up-to resple \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: colcon test (ament_lint_auto suite)
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          colcon test \
            --packages-select resple \
            --event-handlers console_direct+
      - name: Print test results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon test-result --verbose --all
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ament-lint-results
          path: |
            log/
            build/resple/test_results/
          retention-days: 7
